<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wahaj Demo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f4c5c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: deep-teal masthead with language toggle, three headline findings, then the paper-style map beside the gate readout. One light look, chosen for a bright exhibition hall. */
:root{
  color-scheme:light;
  --bg:#f4f6f5; --panel:#ffffff; --ink:#13201e; --grey:#586764; --rule:#d5dcda;
  --brand:#0f4c5c; --brand-ink:#ffffff; --brand-soft:#dcebee; --gold:#b8862b;
  --sea:#dfeaee; --land:#fbfbf9;
  --g1:#a6d79a; --g2:#5fae62; --g3:#2e7d32; --g4:#1b4d1e;
  --pass:#1b6e2d; --pass-bg:#e1f2e5; --fail:#b0201b; --fail-bg:#f9e1df; --wait:#855c00; --wait-bg:#f7ecd2;
  --display:"Archivo","IBM Plex Sans KR","Noto Sans KR","Segoe UI",sans-serif;
  --font:"IBM Plex Sans","IBM Plex Sans KR","Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{word-break:keep-all;overflow-wrap:anywhere;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;margin:0}
.band{background:var(--brand);color:var(--brand-ink);box-shadow:inset 0 -4px 0 var(--gold)}
.inner{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:20px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.2vw,44px);margin:0;line-height:1;letter-spacing:-.01em}
h1 small{font-size:.5em;font-weight:600;opacity:.85;margin-left:.4em}
.tag{margin:6px 0 0;font-size:17px;opacity:.92}
.badge{display:inline-block;margin:10px 0 0;font-size:13px;font-weight:600;color:#f2d79a;border:1px solid rgba(242,215,154,.6);border-radius:999px;padding:3px 12px}
.kr{border-left:5px solid var(--brand)}
.kr h2{font-family:var(--display);font-size:19px;font-weight:800;margin:0 0 6px;color:var(--brand)}
.kr p{margin:0;max-width:90ch}
:lang(ko) body,html:lang(ko) body{line-height:1.6}
html:lang(ko) h1,html:lang(ko) .v,html:lang(ko) .fact b,html:lang(ko) .kr h2{letter-spacing:-.02em}
html:lang(ko) .v,html:lang(ko) .kr h2{font-family:"IBM Plex Sans KR",var(--display);font-weight:700}
.right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.patent{font-size:14px;opacity:.9;white-space:nowrap}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-size:15px;font-weight:600;padding:8px 16px;border:0;background:transparent;color:var(--brand-ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
.lang button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.12)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main.inner{padding-block:20px 36px;display:flex;flex-direction:column;gap:18px}
.intro{margin:0;max-width:78ch;color:var(--grey)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
@media (max-width:720px){.facts{grid-template-columns:1fr}}
.fact{padding:12px 18px 12px 0}.fact+.fact{padding-left:18px;border-left:1px solid var(--rule)}
@media (max-width:720px){.fact+.fact{padding-left:0;border-left:0;border-top:1px solid var(--rule)}}
.fact b{display:block;font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.fact span{font-size:14px;color:var(--grey)}
.fact:nth-child(1) b{color:var(--g3)}.fact:nth-child(2) b{color:var(--fail)}.fact:nth-child(3) b{color:var(--brand)}
.tour{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tour strong{font-size:15px;margin-right:4px}
.tour button{font:inherit;font-size:14.5px;font-weight:500;border:1px solid var(--rule);color:var(--ink);background:var(--panel);border-radius:8px;padding:6px 14px 6px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(19,32,30,.06);transition:background .15s,border-color .15s}
.tour button i{font-style:normal;font-family:var(--display);font-weight:800;font-size:13px;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand)}
.tour button:hover{border-color:var(--brand);background:#f7fbfc}
.tour button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tour button[aria-pressed="true"] i{background:var(--gold);color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(19,32,30,.05),0 6px 18px rgba(19,32,30,.05)}
figure{margin:0}
canvas{width:100%;height:auto;display:block;cursor:pointer;touch-action:manipulation}
figcaption{font-size:14px;color:var(--grey);margin-top:6px}
.ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center}
.ctl label{font-weight:600;font-size:15px}
select{font:inherit;font-size:15px;width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
select:hover{border-color:var(--brand)}
.tolrow{display:flex;gap:10px;align-items:center}
.tolrow input{flex:1;min-width:0;accent-color:var(--brand)}
.tolrow output{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.verdict{padding:12px 16px;margin:16px 0 6px;border-left:5px solid currentColor;border-radius:0 8px 8px 0}
.vrow{display:flex;align-items:center;gap:10px}
.vi{flex:none;width:30px;height:30px;border-radius:50%;background:currentColor;display:inline-flex;align-items:center;justify-content:center}
.vi svg{width:18px;height:18px}
.act{margin:10px 0 0;padding-top:9px;border-top:1px solid rgba(19,32,30,.12);font-size:14.5px;color:var(--ink)}
.act b{font-weight:700}
.gsum{margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14.5px;color:var(--grey)}
.gsum .gc{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid currentColor;background:var(--panel)}
.gsum .gc.pass{color:var(--pass);background:var(--pass-bg)}.gsum .gc.fail{color:var(--fail);background:var(--fail-bg)}.gsum .gc.wait{color:var(--wait);background:var(--wait-bg)}
.gsum .gc b{font-family:var(--display);font-weight:800}
.verdict .k{font-size:14px;color:var(--grey)}
.verdict .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15}
.verdict p{margin:4px 0 0;font-size:15px;color:var(--ink)}
.pass{color:var(--pass);background:var(--pass-bg)} .fail{color:var(--fail);background:var(--fail-bg)} .wait{color:var(--wait);background:var(--wait-bg)}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding-left:12px;white-space:nowrap;color:var(--brand)}
td small{display:block;color:var(--grey);font-size:13px;font-weight:400}
@media (max-width:480px){td:last-child{white-space:normal}}
h2{font-size:15px;font-weight:600;margin:16px 0 4px}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font);font-size:12px;fill:var(--grey)}
.small{font-size:14px;color:var(--grey);margin:6px 0 0}
footer{padding-top:12px;border-top:1px solid var(--rule);font-size:14px;color:var(--grey);display:flex;flex-wrap:wrap;gap:4px 24px}
footer a{color:var(--brand)}
</style>
</head>
<body>


<div class="band"><div class="inner mast">
  <div>
    <h1 id="title">Wahaj<small lang="ko">와하지</small></h1>
    <p class="tag" data-t="tag"></p>
    <p class="badge" data-t="badge"></p>
  </div>
  <div class="right">
    <div class="lang" role="group" aria-label="Language"><button type="button" id="btnEn">English</button><button type="button" id="btnKo" lang="ko">한국어</button></div>
  </div>
</div></div>

<main class="inner">
  <p class="intro" data-t="intro"></p>

  <div class="facts">
    <div class="fact"><b>−1.18 °C</b><span data-t="f1"></span></div>
    <div class="fact"><b data-t="f2n"></b><span data-t="f2"></span></div>
    <div class="fact"><b>14 / 744</b><span data-t="f3"></span></div>
  </div>

  <div class="tour" role="group" aria-label="Guided tour">
    <strong data-t="tour"></strong>
    <button type="button" data-step="1" data-t="t1"></button>
    <button type="button" data-step="2" data-t="t2"></button>
    <button type="button" data-step="3" data-t="t3"></button>
  </div>

  <p class="gsum" id="gSum" aria-live="polite"></p>

  <div class="cols">
    <figure class="card">
      <canvas id="map" width="880" height="980" role="img" aria-label="Map of Jeddah's greened cells"></canvas>
      <figcaption data-t="cap"></figcaption>
    </figure>

    <div class="card" aria-live="polite">
      <div class="ctl">
        <label for="set" data-t="lSet"></label>
        <select id="set"><option value="out" data-t="out"></option><option value="bu" data-t="bu"></option></select>
        <label for="dose" data-t="lDose"></label>
        <select id="dose"><option>1-2</option><option>3-4</option><option>5-8</option><option>9</option></select>
        <label for="tol" data-t="lTol"></label>
        <div class="tolrow"><input id="tol" type="range" min="0.25" max="3" step="0.25" value="1"><output id="tolOut" for="tol"></output></div>
      </div>

      <div class="verdict" id="verdict">
        <div class="k" data-t="gate"></div>
        <div class="vrow"><span class="vi" id="vIcon" aria-hidden="true"></span><div class="v" id="stTitle"></div></div>
        <p id="stWhy"></p>
        <p class="act" id="stAct"></p>
      </div>

      <table>
        <tr><td><span data-t="rCool"></span><small data-t="rCoolS"></small></td><td id="vCool"></td></tr>
        <tr><td><span data-t="rModel"></span><small data-t="rModelS"></small></td><td id="vModel"></td></tr>
        <tr><td><span data-t="rSup"></span><small data-t="rSupS"></small></td><td id="vSup"></td></tr>
        <tr><td><span data-t="rWater"></span><small data-t="rWaterS"></small></td><td id="vWater"></td></tr>
        <tr><td><span data-t="rEnergy"></span><small data-t="rEnergyS"></small></td><td id="vEnergy"></td></tr>
      </table>

      <h2 data-t="chartH"></h2>
      <svg id="gapChart" viewBox="0 0 480 78" role="img" aria-label="Model error interval and tolerance band"></svg>
      <p class="small" id="gapNote"></p>
    </div>
  </div>

  <section class="card kr"><h2 data-t="krH"></h2><p data-t="krP"></p></section>

  <p class="small" data-t="note"></p>
  <footer><span data-t="who"></span><span data-t="data"></span><span><a href="https://github.com/nelmkt/Wahaj-Framework" data-t="code"></a></span></footer>
</main>

  c.fillStyle=col("--panel");c.globalAlpha=.92;c.fillRect(x1-bw-10,y0+8,bw,114);c.globalAlpha=1;c.strokeStyle=col("--rule");c.strokeRect(x1-bw-10,y0+8,bw,114);
  c.fillStyle=col("--ink");c.font="600 16px "+f;c.fillText(L().leg,x1-bw,y0+28);
  lg.forEach(([d,t],i)=>{const y=y0+52+i*21;c.beginPath();c.arc(x1-bw+8,y-5,6,0,7);c.fillStyle=dc(d);c.fill();c.fillStyle=col("--ink");c.font="16px "+f;c.fillText(t,x1-bw+22,y)});
}
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*cv.width/r.width,my=(e.clientY-r.top)*cv.height/r.height;
  let best=null,bd=1200;for(const[a,b,p,s]of MAP.pts){const q=P(a,b),d=(q[0]-mx)**2+(q[1]-my)**2;if(d<bd){bd=d;best=[p,s]}}
  if(best){S.set=best[1]?"bu":"out";S.dose=doseOf(best[0]);S.step=0;render()}});
const fm=(x,d=2)=>(x>0?"+":x<0?"−":"")+Math.abs(x).toFixed(d);
function gate(o){const t=L(),c=o&&o.cool!=null?fm(o.cool,1):"";
  if(!o||o.n<10)return["wait",t.wFew(o||{n:0}),t.aFew];
  if(o.sup<10||!o.sBlocks||o.sBlocks<5)return["wait",t.wSup(o),t.aWait(c)];
  if(o.sRefits<200)return["wait",t.wRef,t.aWait(c)];
  const ok=o.sGapLo>=-S.tol&&o.sGapHi<=S.tol,a=[fm(o.sGapLo),fm(o.sGapHi),S.tol.toFixed(2)];
  return ok?["pass",t.wPass(...a),t.aPass]:["fail",t.wFail(...a),t.aFail(c)];
}
function summary(){const t=L(),n={pass:0,fail:0,wait:0};Object.keys(R).forEach(key=>{n[gate(R[key])[0]]++});
  const ic={pass:"✓",fail:"✕",wait:"!"},lab={pass:t.sP,fail:t.sF,wait:t.sW};
  document.getElementById("gSum").innerHTML=`<span>${t.sumL(S.tol.toFixed(2))}</span>`+["pass","fail","wait"].map(k=>`<span class="gc ${k}">${ic[k]} <b>${n[k]}</b> ${lab[k]}</span>`).join("");}
function chart(o){
  const W=480,x=v=>34+(v+3)/11*(W-54);let s="";
  s+=`<rect x="${x(-S.tol)}" y="10" width="${x(S.tol)-x(-S.tol)}" height="30" fill="${col("--brand-soft")}"/>`;
  s+=`<line x1="34" x2="${W-20}" y1="48" y2="48" stroke="${col("--ink")}"/>`;
  [-3,0,3,6].forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="48" y2="53" stroke="${col("--ink")}"/><text x="${x(t)}" y="68" text-anchor="middle">${t>0?"+":t<0?"−":""}${Math.abs(t)} °C</text>`});
  s+=`<line x1="${x(0)}" x2="${x(0)}" y1="8" y2="48" stroke="${col("--grey")}" stroke-dasharray="3 3"/>`;
  if(o&&o.sGapLo!=null){const k=col("--ink");s+=`<line x1="${x(o.sGapLo)}" x2="${x(o.sGapHi)}" y1="25" y2="25" stroke="${k}" stroke-width="2.5"/><line x1="${x(o.sGapLo)}" x2="${x(o.sGapLo)}" y1="18" y2="32" stroke="${k}" stroke-width="2.5"/><line x1="${x(o.sGapHi)}" x2="${x(o.sGapHi)}" y1="18" y2="32" stroke="${k}" stroke-width="2.5"/><circle cx="${x(o.sGap)}" cy="25" r="5" fill="${k}"/>`}
  else s+=`<text x="${x(1.4)}" y="30">${L().noSup}</text>`;
  document.getElementById("gapChart").innerHTML=s;
  document.getElementById("gapNote").textContent=o&&o.gapB!=null?L().gapNote({n:o.n,g:fm(o.gapB),lo:fm(o.gapBLo),hi:fm(o.gapBHi)}):"";
}
function render(){
  const t=L();document.documentElement.lang=S.lang;document.getElementById("title").innerHTML=S.lang==="ko"?'와하지<small lang="en">Wahaj</small>':'Wahaj<small lang="ko">와하지</small>';
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t]});
  document.getElementById("btnEn").setAttribute("aria-pressed",S.lang==="en");document.getElementById("btnKo").setAttribute("aria-pressed",S.lang==="ko");
  document.querySelectorAll(".tour button").forEach(b=>{const m=b.textContent.match(/^(\d)\.\s*(.*)$/);if(m)b.innerHTML="<i>"+m[1]+"</i>"+m[2]});document.querySelectorAll(".tour button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.step===S.step)));
  document.getElementById("set").value=S.set;document.getElementById("dose").value=S.dose;document.getElementById("tol").value=S.tol;
  document.getElementById("tolOut").textContent="±"+S.tol.toFixed(2)+" °C";
  const o=R[S.set+"|"+S.dose],[k,w,act]=gate(o);document.getElementById("stAct").innerHTML="<b>"+t.actL+"</b> "+act;summary();
  document.getElementById("verdict").className="verdict "+k;const VI={pass:"<path d=\"M5 12.5l4.2 4.2L19 7\"/>",fail:"<path d=\"M7 7l10 10M17 7L7 17\"/>",wait:"<path d=\"M12 7v6\"/><circle cx=\"12\" cy=\"17\" r=\"0.6\"/>"};document.getElementById("vIcon").innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">'+VI[k]+"</svg>";document.getElementById("stTitle").textContent=k==="wait"?t.waitT:t[k];document.querySelector("#verdict .k").textContent=k==="wait"?t.gate+": "+t.wait.toLowerCase():t.gate;document.getElementById("stWhy").textContent=w;
  const has=o&&o.cool!=null,nf=n=>n.toLocaleString("en");
  document.getElementById("vCool").textContent=has?`${fm(o.cool)} °C (${fm(o.coolLo)} ~ ${fm(o.coolHi)})`:t.few;
  document.getElementById("vModel").textContent=o&&o.modelB!=null?`${fm(o.modelB)} °C`:t.na;
  document.getElementById("vSup").textContent=o?t.of(o.sup,o.n):t.na;
  document.getElementById("vWater").textContent=has?`${nf(o.m3)} (${nf(o.m3Lo)}-${nf(o.m3Hi)})`:t.na;
  document.getElementById("vEnergy").textContent=has?`${o.swro.toFixed(2)} / ${o.tse.toFixed(2)}`:t.na;
  chart(o);draw();
}
const STEPS={1:["out","9",1],2:["bu","1-2",1],3:["bu","1-2",0.5]};
document.querySelectorAll(".tour button").forEach(b=>b.onclick=()=>{const s=STEPS[b.dataset.step];S.set=s[0];S.dose=s[1];S.tol=s[2];S.step=+b.dataset.step;render()});
document.getElementById("btnEn").onclick=()=>{S.lang="en";render()};
document.getElementById("btnKo").onclick=()=>{S.lang="ko";render()};
document.getElementById("set").onchange=e=>{S.set=e.target.value;S.step=0;render()};
document.getElementById("dose").onchange=e=>{S.dose=e.target.value;S.step=0;render()};
document.getElementById("tol").oninput=e=>{S.tol=+e.target.value;S.step=0;render()};
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
